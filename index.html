<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mariage de Tiphaine & Théo</title>

  <style>
    :root {
      --bg: #f7f7f5;
      --text: #111111;
      --muted: #77736d;
      --line: rgba(17, 17, 17, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(92vw, 1180px);
      margin: 0 auto;
      padding: 5vh 0 5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 900ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 1.2rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 3rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 6vw, 5.8rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.045em;
      text-align: center;
    }

    .video-frame {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
    }

    .cta {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2.25rem;
    }

    .caption {
      margin: 0 0 1.35rem;
      max-width: 36rem;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      font-style: italic;
      text-align: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      min-height: 54px;
      padding: 0.9rem 1.6rem;
      border: 1px solid #111111;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition:
        background-color 180ms ease,
        color 180ms ease,
        transform 180ms ease;
    }

    .button::after {
      content: "→";
      margin-left: 0.85rem;
      font-size: 1rem;
      line-height: 1;
    }

    .button:hover,
    .button:focus-visible {
      background: transparent;
      color: #111111;
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: 2px solid #111111;
      outline-offset: 4px;
    }

    .footer-mark {
      margin-top: 4.5rem;
      font-size: 0.66rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #8b8882;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      main {
        width: min(94vw, 1180px);
        padding: 4vh 0 6vh;
      }

      h1 {
        margin-bottom: 2rem;
      }

      .cta {
        padding-top: 1.75rem;
      }

      .button {
        width: 100%;
        min-width: 0;
      }

      .footer-mark {
        margin-top: 3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }

      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">11 & 12.09.26</p>
    <h1>Mariage</h1>

    <div class="video-frame">
      <video autoplay muted loop playsinline preload="auto">
        <source src="intro.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="cta">
      <a
        class="button"
        href="https://titi26.myportfolio.com/"
        aria-label="View the wedding photographs"
      >
        Voir les photos
      </a>
    </div>
  </main>
</body>
</html>
